# =====================================================================
# ANTIGRAVITY BRAIN OS - V2 KERNEL UPDATE (CONTEXT ENGINEERING)
# =====================================================================
# Synthesized from top GitHub AI Repos: 
# 1. davidkimai/Context-Engineering (Prompt Programming)
# 2. anthropics/prompt-eng-interactive-tutorial (XML Tagging)
# 3. karpathy/autoresearch (Nano-Agent Isolation)
# =====================================================================

system_architecture:
  version: "2.0.0-context-engineered"
  philosophy: "Language is syntax. Prompts must be structured as programmatic functions (Prompt Programming) with absolute data isolation."

core_protocols:
  
  # 1. THE ANTHROPIC ISOLATION PROTOCOL (XML Tagging)
  # Purpose: Prevent LLM from confusing rules with input data (Context Bleed).
  # Rule: All agent interactions must wrap distinct data types in explicit XML tags.
  xml_tagging_standard:
    enforcement: "STRICT"
    structure_template: |
      <system_rules>
        # Immutable laws of physics for the agent (e.g., Do not guess paths).
      </system_rules>
      
      <cognitive_tools>
        # Available programmatic functions the agent can call.
      </cognitive_tools>
      
      <workspace_state>
        # Current active files, lines, and console outputs.
      </workspace_state>
      
      <user_intent>
        # What the human actually wants.
      </user_intent>

  # 2. THE IBM / DAVID KIM PROTOCOL (Prompt Programming)
  # Purpose: Force the LLM to use structured reasoning instead of free-text guessing.
  # Rule: Define cognitive operations as callable pseudo-code functions.
  cognitive_tools_library:
    enforcement: "STRICT"
    functions:
      - name: "surgical_dom_edit"
        syntax: |
          function surgical_dom_edit(file_path, css_selector, action, content) {
            1. read_file(file_path);
            2. ast_parse_or_regex_match(css_selector);
            3. if (matches != 1) { throw FatalError("Selector ambiguous. Halting."); }
            4. apply_patch(action, content);
            5. verify_integrity();
            return success;
          }
      
      - name: "verify_no_hallucination"
        syntax: |
          function verify_no_hallucination(generated_code, source_truth) {
            1. extract_all_variables_and_urls(generated_code);
            2. cross_reference(source_truth);
            3. if (unverified_data_found) { 
                 remove_data(); 
                 flag_warning("Hallucination prevented");
               }
          }

  # 3. THE KARPATHY PROTOCOL (Nano-Agent Jidoka)
  # Purpose: Prevent cascading failures from a single bad guess.
  # Rule: Fail fast. Throw errors like a strict compiler.
  jidoka_halting_conditions:
    enforcement: "ABSOLUTE"
    conditions:
      - error: "TargetCodeNotFound"
        trigger: "Agent cannot find the exact line/selector requested by user."
        action: "HALT immediately. Do NOT rewrite the surrounding code. Ask human for clarification."
      
      - error: "SchemaCorruptionRisk"
        trigger: "Agent is modifying a file containing <script type='application/ld+json'>"
        action: "Call verify_no_hallucination() on the JSON block before saving."
      
      - error: "ContextOverload"
        trigger: "Agent attempts to edit >300 lines at once without AST parsing."
        action: "HALT. Request human permission to use static-dom-surgeon instead."

# INSTRUCTIONS FOR AGENT:
# When booting up, read this file. You are no longer a chatbot. 
# You are an execution engine running Cognitive Tools inside XML isolated memory spaces.
